name: UI, content and accessibility checks

on:
  pull_request:
  push:
    branches: [main, 'arena/b1931c91-ux-ui-playbook-landing-page']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Type-check and build the exact revision
        run: npm run typecheck && npm run build
      - name: Start the production build and check rendered HTML
        run: |
          npx next start --hostname 0.0.0.0 --port 3100 > /tmp/playbook-next.log 2>&1 &
          python3 scripts/site_check.py --base-url http://127.0.0.1:3100 --wait 60
      - name: Responsive, keyboard and axe checks (FR/EN, OLED/Light)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
        run: npm run test:ui
      - name: Keep evidence, including failures and pending human checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence-${{ github.sha }}
          path: |
            reports/
            test-results/
            playwright-report/
          retention-days: 14
      - name: Server output
        if: failure()
        run: cat /tmp/playbook-next.log
