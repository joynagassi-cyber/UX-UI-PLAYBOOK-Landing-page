name: UI, content and accessibility checks

on:
  pull_request:
  push:
    branches: [main, cloudflare-migration-v2, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-check-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://joyccelight-playbook.pages.dev
  NEXT_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100

jobs:
  ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Type-check, unit-test and export the exact revision
        run: npm run check:preservation && npm run lint && npm run typecheck && npm test && npm run build && npm run check:export
      - name: Serve the actual Worker and asset binding locally and check rendered HTML
        run: |
          mkdir -p reports
          npm run preview:worker > reports/worker-server.log 2>&1 &
          echo $! > reports/worker-server.pid
          python3 scripts/site_check.py --base-url "$PLAYWRIGHT_BASE_URL" --expected-origin "$NEXT_PUBLIC_SITE_URL" --wait 120
          python3 scripts/seo_check.py --base-url "$PLAYWRIGHT_BASE_URL" --expected-origin "$NEXT_PUBLIC_SITE_URL"
      - name: Worker routing, FR/EN interfaces, keyboard and axe
        run: npm run test:ui
      - name: Keep reports, traces, screenshots and Worker server output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence-${{ github.sha }}
          path: |
            reports/
            test-results/
            playwright-report/
          retention-days: 14
      - name: Stop the local-only Worker server
        if: always()
        run: |
          if [ -f reports/worker-server.pid ]; then
            kill "$(cat reports/worker-server.pid)" 2>/dev/null || true
          fi
